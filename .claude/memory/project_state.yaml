# ── Decisions (architectural, không hiển nhiên từ code) ────────────
decisions:
- date: "2026-10-01"
  decision: "Ops go-live: Keycloak self-host trong compose prod (start + DB Postgres riêng 'keycloak'); secrets prod = Docker secrets file (chưa Vault); observability = compose riêng deploy/observability (project qgp-obs); CSP = template env lúc start, mặc định Report-Only."
  reason: "User chốt 4 lựa chọn (AskUserQuestion 2026-10-01). Docker secrets dùng cùng cơ chế /run/secrets như Vault Agent → lên Vault sau không sửa code. CSP Report-Only tránh chặn login OIDC khi origin sai."
  impact: "Compose prod BREAKING: cần deploy/secrets/{POSTGRES_PASSWORD,QGP_DB_CONNECTION,QGP_MEILI_KEY} + env KC_HOSTNAME/KC_DB_PASSWORD/QGP_WEB_ORIGIN. Keycloak staging cũ (start-dev H2) mất dữ liệu khi chuyển — realm prod import lại, không user mẫu. Migration chạy bằng service 'migrate' (EF bundle) trước api."
- date: "2026-07-26"
  decision: "B0 — Lớp CHIẾU (projection) user/role: DB mirror role từ token Keycloak (KHÔNG phải nguồn authz mới). Sync ở GET /me. B1 quản trị user/role = CHỈ ĐỌC (không sửa role trong app); đổi role làm ở Keycloak."
  reason: "User chốt (Q1 = 'Read-only RBAC + editable taxonomy'). A1a đặt Keycloak là nguồn sự thật cho role (authz đọc realm_access.roles trong token, KeycloakClaimsTransformation.cs). user_roles DB KHÔNG được authz dùng ở prod → nếu để admin UI sửa user_roles sẽ vô tác dụng + gây hiểu lầm. Nhưng B1 viewer + B2 notify CẦN dữ liệu role trong DB → chiếu từ token lúc /me."
  impact: "UserProvisioningService.SyncAsync upsert user + reconcile user_roles (mirror) mỗi lần /me. /me giờ chạm DB (best-effort projection; nếu muốn robust khi DB down có thể bọc try/catch sau). Chỉ user ĐÃ login mới có trong DB → B1 users list + B2 recipients chỉ thấy người đã đăng nhập (tự lành). tokenRoles/RoleMap là ánh xạ keycloak-role→app-role (đã có ở appsettings Auth:RoleMap + FE tokenRoles.ts). Nếu sau muốn admin UI SỬA role thật → phải tích hợp Keycloak Admin API (đã bàn, chưa làm)."
- date: "2026-07-26"
  decision: "B2 — Review reminder (DOC-F-08): recipients = QA_LEAD+ADMIN (RACI Accountable), cửa sổ 30 ngày + quá hạn; dedupe theo (doc,type) trong leadDays ngày; Quartz job daily gated-off ở Testing"
  reason: "User chốt (Q3 = 'QA_LEAD+ADMIN, 30d + overdue'). Khớp RPT-F-02 (quá hạn/sắp tới hạn). Dedupe tránh spam mỗi ngày. Gated-off Testing theo pattern EffectiveTransitionJob/AuditPartitionMaintenanceJob (test gọi service trực tiếp, deterministic)."
  impact: "Notification type mới: doc_review_due / doc_review_overdue (bell hiện dùng chung — FE có thể thêm nhãn/icon theo type sau). LeadDaysWarn cấu hình appsettings Review:LeadDaysWarn (mặc định 30). Job quét MỌI doc có next_review_date (kể cả Draft) — hiện chấp nhận; nếu chỉ muốn Effective thì thêm filter sau. Recipients rỗng nếu chưa ai QA_LEAD/ADMIN login (phụ thuộc B0)."
- date: "2026-07-26"
  decision: "B1 doc-types làm CHIỀU SÂU: Document.Type enum→string, bảng doc_types là nguồn sự thật, sửa Mapping/Search/ReportService — ✅ ĐÃ LÀM (b1d0). Doc-type code = giá trị wire cũ (canonical string == stored == doc_types.code), giữ 'Work Instruction' có dấu cách để không phá contract/UI"
  reason: "User chốt 'làm theo chiều sâu, làm chuẩn từ giờ thì sau ít ảnh hưởng'. Cho phép thêm loại tài liệu mới runtime thay vì cố định enum."
  impact: "RỦI RO CAO: đổi Document.Type (enum DocumentType) sang string sẽ lan ~6 file (Mapping.cs map WorkInstruction↔'Work Instruction', DocumentService.CreateAsync validate, ReportService by_type, SearchService filterable[type], openapi enum, seed). Cần migration AddDocTypes + seed từ enum hiện có + validate type theo bảng active lúc tạo doc. Nên làm ở session tập trung, verify E2E kỹ (đừng vỡ REC/Search/Reports đang xanh)."
