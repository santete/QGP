- date: "2026-07-26"
  decision: "Deployment A1+A2 — Auth thật = Keycloak self-hosted (OIDC); role map từ CLAIM Keycloak (realm_access.roles/groups) → 6 app role; Keycloak vào docker-compose để test local"
  reason: "User chốt (đợt đưa vào triển khai, blocker #1). AuthSetup.cs đã có sẵn nhánh Auth:Mode=Oidc. IdP = single source of truth cho role. Keycloak open-source, docker được, hợp on-prem QA governance."
  impact: "BE (không cần dependency mới, dùng JwtBearer sẵn): (1) IClaimsTransformation flatten realm_access.roles → ClaimTypes.Role qua config Auth:RoleMap; (2) appsettings Auth:{Mode,OidcAuthority,Audience,RoleMap}; (3) GATE /auth/dev-login chỉ khi Mode=Dev; (4) docker-compose thêm service keycloak + import realm 'qgp' (client qgp-web public+PKCE, qgp-api audience, roles READER..ADMIN, users mẫu). FE (Hard Stop — cần dependency oidc-client-ts/react-oidc-context): OIDC Authorization Code + PKCE redirect thay mock login → TÁCH thành A1b, xác nhận cài lib trước. Prod: bỏ VITE_USE_MOCK, Auth:Mode=Oidc."
- date: "2026-07-26"
  decision: "Phase 2 (E2.2-E2.4): thêm bảng mới additive (learning_paths/path_items/notifications) qua EF migration; Reports để openapi loose + FE local types; serialize test suite"
  reason: "User cho phép làm tuần tự cả roadmap (bao gồm migration additive không đụng data cũ). Reports response phức tạp/aggregate → additionalProperties đủ, FE dùng interface local (tiền lệ DiffResult). BE test flaky khi thêm 4 test class (audit list top-N bị đẩy khỏi 200 + Meili async) → serialize."
  impact: "3 migration mới. Notification.DocumentId có FK Document CASCADE (xoá doc dọn notification). tests/xunit.runner.json parallelizeTestCollections=false (BE test giờ tuần tự ~16-20s, deterministic). Cần dotnet-ef global (đã cài 8.0.29). Notification sinh cho audience = user_roles ∩ doc_audience_roles (dev sparse vì chưa gán role thật)."
- date: "2026-07-26"
  decision: "A7-OTel dùng ISC.Observability 1.2.2 (SDK FPT do user cấp); gate theo Otel:OtlpEndpoint (off khi rỗng + off ở Testing); GIỮ QgpExceptionHandler (ADR-0014) — UseStandardObservability đặt NGOÀI UseExceptionHandler"
  reason: "User ban hành package nội bộ (không dùng OpenTelemetry chuẩn rời rạc). Gate để dev/test không nhiễu + không cần collector. ISC có global exception handling riêng nhưng QGP có envelope contract ADR-0014 (có test) → đặt UseStandardObservability ngoài UseExceptionHandler để QGP handler (inner) sở hữu body lỗi; đã VERIFY 404 vẫn {error:{code,message}} + ISC log exception kèm TraceId."
  impact: "Prod bật OTLP: set Otel__OtlpEndpoint=http://otel-collector:4317 (compose api đã map env OTEL_OTLP_ENDPOINT). Cần deploy collector + Grafana stack (ADR-0013) để nhận. Cờ instrument: EnableEntityFramework/Quartz=true, còn lại false (khớp stack). Log giờ là Serilog JSON (ServiceName/TraceId/SpanId) khi bật. ISC.Observability kéo theo OpenTelemetry.* + Serilog.* (transitive)."
- date: "2026-07-26"
  decision: "A5-A7 hardening: rate limit off mặc định ở Testing (opt-in cho test) · secret ưu tiên file /run/secrets (Vault Agent) qua AddKeyPerFile · OTel dùng SDK nội bộ FPT (chưa cài lib chuẩn)"
  reason: "Rate limit ON trong suite gây nhiễu (nhiều request/class + env leak PermitLimit giữa test) → default off ở Testing, prod/dev vẫn on. File-secrets khớp ADR-0012 (Vault Agent render file) mà không thêm dependency. User có OTel SDK riêng ban hành cho FPT → chờ package, không cài OpenTelemetry chuẩn để tránh trùng/xung đột."
  impact: "Prod bật rate limit (RateLimit__Enabled mặc định true ngoài Testing). Vault Agent ghi /run/secrets/<Key> (dùng '__' nesting) → BE tự nạp, ưu tiên cao nhất. OTel: khi có package FPT → wire Program.cs (traces+metrics OTLP, bật theo OTEL_EXPORTER_OTLP_ENDPOINT). ForwardedHeaders Clear KnownProxies → CHỈ an toàn khi ingress duy nhất là nginx (đừng expose API trực tiếp)."
- date: "2026-07-26"
  decision: "A1b: FE dùng react-oidc-context + oidc-client-ts (MIT); bật OIDC bằng env VITE_OIDC_AUTHORITY (không thay hẳn mock); giữ nguyên surface useAuth(); roles decode từ ACCESS token client-side"
  reason: "react-oidc-context là chuẩn de-facto cho React (authts), tự lo PKCE/refresh/callback → ít code, ít sai. Env-toggle giữ vertical-slice offline (mock) + dev-login cũ chạy song song, không phá test. Giữ useAuth() surface → guards/pages/client.ts/test KHÔNG đổi. realm_access nằm ở access token (không phải ID token) nên decode access token."
  impact: "3 mode FE: npm run dev (mock) · dev:real (dev-login BE) · dev:oidc (Keycloak thật). OidcAuthProvider PHẢI nằm trong <AuthProvider> react-oidc-context (App bọc khi OIDC_ENABLED). Token sync vào localStorage qgp.access_token → client.ts dùng như cũ. tokenRoles.KEYCLOAK_ROLE_MAP phải KHỚP BE Auth:RoleMap (đổi 1 nơi nhớ đổi cả 2). Prod: build với VITE_OIDC_AUTHORITY=<https realm>, VITE_OIDC_CLIENT_ID, VITE_USE_MOCK=0; redirect_uri/webOrigins Keycloak phải khớp origin prod. Chưa xử lý 401→re-login tự động (access token 15' có automaticSilentRenew; nếu refresh fail vẫn phải login lại) — để hardening."
- date: "2026-07-26"
  decision: "A1a hiện thực: role Keycloak realm lowercase (reader..admin) → app role qua ClaimsTransformation đọc realm_access.roles; Oidc mode dùng authority làm ValidIssuer (không hardcode); Auth:RequireHttpsMetadata=true mặc định (local Keycloak http → false)"
  reason: "Keycloak để realm role trong claim realm_access.roles (JSON), KHÔNG phải claim 'role' phẳng → cần IClaimsTransformation. iss token = URL realm (đã verify token thật) nên ValidIssuer phải = authority. RequireHttpsMetadata bảo mật mặc định true nhưng Keycloak dev chạy http."
  impact: "Bật Oidc prod: set Auth:Mode=Oidc + Auth:OidcAuthority=<realm https url> + Auth:RequireHttpsMetadata=true (prod https) hoặc false (local http). RoleMap trong appsettings map keycloak-role→app-code; đổi tên role IdP chỉ sửa RoleMap, không sửa code. /auth/dev-login TỰ tắt (404) khi Mode≠Dev (DevTokenIssuer không đăng ký + [FromServices]). realm-qgp.json chỉ DEV (user/pass mẫu Password123!, admin/admin) — PROD phải tạo realm riêng, KHÔNG import file này."
