  workaround: "Luôn đọc secret qua IConfiguration (QgpSecrets: file > env > appsettings). Test: SecretConfigTests."
  files_affected: [apps/api/src/Qgp.Api/Infrastructure/QgpSecrets.cs, apps/api/src/Qgp.Api/Program.cs]
