# Schema Snapshot — Single Source of Truth cho external API + DB
# Load khi Phase 0 phát hiện task đụng external API hoặc DB
# Tham khảo: docs/ai/HALLUCINATION_RULES.md, guides/hallucination-guide.md
#
# ⚠️  File này là FILE QUAN TRỌNG NHẤT để prevent hallucination.
# ⚠️  Cập nhật ngay khi phát hiện schema mới hoặc gotcha.

# ── External APIs ──────────────────────────────────────────────────
external_apis:
  keycloak_token:
    purpose: "OIDC IdP (A1a). Access token JWT dùng cho Auth:Mode=Oidc. Đã VERIFY bằng token thật (author1, 2026-07-26)."
    authority_dev: "http://localhost:8081/realms/qgp"
    discovery: "GET {authority}/.well-known/openid-configuration"
    token_endpoint: "POST {authority}/protocol/openid-connect/token"
    claims_present: [iss, aud, sub, preferred_username, email, name, realm_access, resource_access, exp, iat]
    gotcha: "Realm role Ở TRONG realm_access.roles (JSON array), KHÔNG phải claim 'role' phẳng → cần KeycloakClaimsTransformation flatten qua Auth:RoleMap. iss = URL realm (== authority) → ValidIssuer phải = authority (KHÔNG 'qgp-dev'). aud CHỈ có 'qgp-api' nhờ audience mapper trên client qgp-web (nếu thiếu mapper → aud=['account'] → API 401). sub = UUID user (KHÔNG phải username; username ở preferred_username). Local http → JwtBearer cần RequireHttpsMetadata=false."
    not_in_token:            # đừng giả định có
      - "claim 'role' phẳng (roles nằm trong realm_access/resource_access)"
      - "username ở 'sub' (sub là UUID)"
    role_map:                # keycloak realm role (lowercase) → app role (Auth:RoleMap, appsettings.json)
      reader: READER
      contributor: CONTRIBUTOR
      author: AUTHOR
      approver: APPROVER
      qa_lead: QA_LEAD
      admin: ADMIN
