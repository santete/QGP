# ── External services config ──────────────────────────────────────
services:
  meilisearch:
    purpose: "Full-text search VN (E1.4). Index CHỈ tài liệu Effective (BR-06)."
    url_dev: "http://localhost:7700"
    auth: "Bearer {QGP_MEILI_KEY} (dev: qgp_dev_master_key, khớp docker-compose MEILI_MASTER_KEY)"
    index: "documents (primaryKey=id=doc_id); searchable [title,content,tags]; filterable [type,tags]"
    gotcha: "Meili .NET SDK 0.15 KHÔNG auth GET /tasks → dùng HttpClient thô (apps/api/.../MeiliSearchIndex.cs). Reindex: POST /admin/reindex [AdminConfig]. Hook index sau publish-effective + scheduler WF-03."
  redis:
    purpose: "Cache render Effective + idempotency key (chưa wire code, có container)"
    url_dev: "localhost:6379"
