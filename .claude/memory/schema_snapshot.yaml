# ── Internal APIs ──────────────────────────────────────────────────
internal_apis:
  getRecommendations:
    endpoint: "GET /v1/recommendations"
    rbac: "doc.read (mọi role; 0 role → 403)"
    returns: "{ must_read: RecommendationItem[], suggested: RecommendationItem[] }"
    item_fields: [doc_id, version, title, effective_date, reason]
    nullable: [title, effective_date]
    gotcha: "REC-F-02/BR-11 (SDD §5.2). candidates = Effective ∩ audience_roles(user.roles). reason nguyên văn tiếng Việt: 'Bắt buộc'|'Cần đọc lại'|'Vừa cập nhật'|'Khớp vai trò'. Roles đọc từ claim 'role'. Read-only (KHÔNG upsert user như audit). Redis cache 5m (§5.2) CHƯA wire — hiện tính mỗi request. FE '/' = HomePage, '/start' = StartHerePage dùng chung endpoint này."
  getOnboarding:
    endpoint: "GET /v1/onboarding"
    rbac: "doc.read (0 role → 403)"
    returns: "{ title?, roles: string[], progress: {total,read,percent}, items: OnboardingItem[] }"
    item_fields: [doc_id, title, seq, mandatory, effective_version, acked]
    nullable: [title, effective_version]
    gotcha: "ONB-F-01/02/04 (S12). Gộp learning_paths của mọi role user; item xếp theo seq; acked = ack bản Effective hiện hành. Read-only. FE route /onboarding = OnboardingPage."
  reports:
    endpoints: ["GET /v1/reports/issuance", "GET /v1/reports/compliance", "GET /v1/reports/feedback", "GET /v1/reports/access"]
    rbac: "admin.config (QA_LEAD/ADMIN; READER → 403)"
    issuance_returns: "{ total_documents, effective_count, by_type{}, by_version_status{}, issued_this_month, overdue_review, due_soon_review, with_change_summary_percent }"
    compliance_returns: "{ mandatory_docs, fully_compliant_docs, items:[{doc_id,title,effective_version,audience_count,acked_count,percent,not_read[]}] }"
    feedback_returns: "{ total, by_status{}, avg_resolution_hours, resolved_count } (RPT-F-05 — data thật từ feedback table)"
    access_returns: "{ effective_with_zero_ack, zero_ack_docs[], top_engaged[], note } (RPT-F-03 — PROXY theo ack, CHƯA có event lượt xem; note nêu rõ)"
    gotcha: "RPT-F-01/02/03/04/05 (S15). openapi loose (additionalProperties) → FE local interface (types.ts, tiền lệ DiffResult). Compliance audience = user_roles ∩ doc_audience_roles (dev thường 0). Access là PROXY (event tracking doc_viewed/search_performed để P3). Aggregate — privacy §6."
  admin_s17:
    endpoints:
      - "GET /v1/admin/rbac"                       # ma trận §10.1 (read-only)
      - "GET /v1/admin/users?limit"                # user (lớp chiếu B0) + role
      - "GET|POST /v1/admin/tags · PATCH|DELETE /v1/admin/tags/{id}"
      - "GET /v1/doc-types (active, doc.read) · GET|POST /v1/admin/doc-types · PATCH|DELETE /v1/admin/doc-types/{id}"
      - "GET|PUT /v1/documents/{docId}/audience"
    rbac: "admin.config (QA_LEAD/ADMIN) cho mọi /admin/* + audience; /v1/doc-types (active) = doc.read (form/filter)"
    gotcha: "B1/S17 (ADM-F-01/02). RBAC read-only (không sửa role trong app — Keycloak là nguồn authz; users list từ lớp chiếu B0). Tag CRUD: xoá chặn nếu đang gắn (TAG_IN_USE); slug unique (TAG_SLUG_CONFLICT). Doc-type: code bất biến (PATCH chỉ label/seq/active), xoá chặn nếu dùng (DOC_TYPE_IN_USE), tạo doc validate type theo doc_types active. Audience PUT thay thế toàn bộ tập (reconcile), validate role code. FE dùng local interface (openapi loose, tiền lệ DiffResult): RbacMatrix/AdminUser/AdminTag/AdminDocType/DocAudienceItem trong types.ts; AdminPage /admin 4 tab (RBAC/Users/Tags/DocTypes). Audience UI để DocumentPage (BE + test xong, UI sau)."
  notifications:
    endpoints: ["GET /v1/notifications?unread_only", "POST /v1/notifications/{id}/read", "POST /v1/notifications/read-all"]
    rbac: "doc.read"
    list_returns: "{ data: Notification[], unread_count }"
    item_fields: [id, type, doc_id, title, read, created_at]
    nullable: [doc_id]
    gotcha: "ADM-F-04/S19. Sinh khi doc thành Effective cho audience (xem bảng notifications). mark-read chỉ chủ sở hữu (else NOTIFICATION_NOT_FOUND). FE = NotificationBell dropdown trong AppShell (không route riêng). type values: 'doc_effective' (S19) · 'doc_review_due'/'doc_review_overdue' (B2/DOC-F-08 — ReviewReminderService, người nhận QA_LEAD/ADMIN, dedupe theo (doc,type) trong LeadDaysWarn=30 ngày)."
