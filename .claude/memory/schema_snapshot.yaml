# ── Database schema ────────────────────────────────────────────────
# QGP Postgres 16 · schema "qgp" (KHÔNG dùng public) · EF Core migration InitialCreate
# (apps/api/src/Qgp.Api/Infrastructure/Persistence/Migrations/*_InitialCreate.cs).
# Mọi bảng: id UUID DEFAULT gen_random_uuid(); business table có created_at+updated_at (now()).
# Enum lưu dạng text (Status/Type/Category/RelationType). 12 bảng core.
database:
  documents:
    columns: [id, doc_id, title, type, classification, current_effective_version_id, mandatory_ack, next_review_date, created_at, updated_at]
    nullable: [classification, current_effective_version_id, next_review_date]
    unique: [doc_id]                 # uq_doc_id (BR-01)
    gotcha: "doc_id là business key immutable (BR-01); current_effective_version_id trỏ bản Effective (BR-02, nullable). B1 chiều sâu (2026-07-26): type GIỜ là string tự do (bỏ enum DocumentType) = doc_types.code, maxlen 50, validate lúc tạo doc theo doc_types active. Giá trị wire GIỮ NGUYÊN (kể cả 'Work Instruction' có dấu cách); migration AddDocTypes fix dữ liệu cũ 'WorkInstruction'→'Work Instruction'."
  document_versions:
    columns: [id, document_id, version, status, issue_date, effective_date, change_summary, content_git_ref, content_markdown, created_at, updated_at]
    nullable: [issue_date, effective_date, change_summary, content_git_ref, content_markdown]
    note: "content_markdown = nội dung tạm ở DB (migration AddVersionContent) TRƯỚC khi có Git store (E1.6); content_html render bằng Markdig từ content_markdown"
    indexes: [uq_one_effective_per_doc, document_versions_status_effective_date_idx]
    gotcha: "uq_one_effective_per_doc = PARTIAL UNIQUE (document_id) WHERE status='Effective' (BR-02); CHECK ck_effective_ge_issue: effective_date>=issue_date (BR-07). status text 8 giá trị (7 openapi + UnderRevision nội bộ). content: draft ở content_markdown (DB, mutable qua PATCH /versions/{id}/content); khi PUBLISH → commit vào Git → content_git_ref = SHA (LibGit2Sharp, ADR-0015, immutable BR-03)."
  roles:
    columns: [id, code, name, created_at, updated_at]
    unique: [code]
    seeded: [READER, CONTRIBUTOR, AUTHOR, APPROVER, QA_LEAD, ADMIN]   # SDD §6.2, HasData Guid cố định 1111..1101-1106
  users:
    columns: [id, sso_subject, display_name, email, created_at, updated_at]
    nullable: [display_name, email]
    unique: [sso_subject]
    gotcha: "PII tối thiểu (OD-3); định danh qua OIDC sso_subject. B0 (2026-07-26): GET /me gọi UserProvisioningService.SyncAsync → upsert user (ON CONFLICT + COALESCE profile) + RECONCILE user_roles theo claim 'role' (mirror). DB CHỈ CHIẾU role từ Keycloak (authz vẫn đọc token, KHÔNG đọc user_roles ở prod). Chỉ user đã login mới có trong DB → B1 users list + B2 recipients (QA_LEAD/ADMIN) chỉ thấy người đã đăng nhập."
  user_roles: { columns: [user_id, role_id, created_at], pk: [user_id, role_id] }
  tags: { columns: [id, slug, name, created_at, updated_at], unique: [slug] }
  doc_types:
    columns: [id, code, label, seq, active, created_at, updated_at]
    unique: [code]                   # uq_doc_types_code
    seeded: ["Policy", "Process", "Procedure", "Work Instruction", "Template", "Checklist", "Standard"]   # Guid 2222..2201-2207
    gotcha: "B1 chiều sâu (migration AddDocTypes 2026-07-26). NGUỒN SỰ THẬT cho loại tài liệu thay enum DocumentType. code = giá trị dùng ở documents.type + Meili filter (ổn định, KHÔNG sửa qua PATCH); label để hiển thị; seq thứ tự; active bật/tắt. Seed code==label==giá trị wire cũ. CRUD /v1/admin/doc-types; xoá chặn nếu documents còn dùng (DOC_TYPE_IN_USE). Thêm loại mới runtime → không cần đổi code/enum."
  doc_tags: { columns: [document_id, tag_id, created_at], pk: [document_id, tag_id] }
  doc_audience_roles:
    columns: [document_id, role_id, reason, created_at]
    pk: [document_id, role_id]
    indexes: [doc_audience_roles_role_id_idx]
    gotcha: "reason = nguồn explainable cho REC (BR-11)"
  doc_relations:
    columns: [id, source_document_id, target_document_id, relation_type, created_at, updated_at]
    unique: [uq_doc_relation (source,target,relation_type)]
    gotcha: "relation_type text: Supersedes/DependsOn/Impacts (DOC-F-07)"
  acknowledgements:
    columns: [id, user_id, version_id, acked_at, created_at, updated_at]
    unique: [uq_ack_user_version (user_id,version_id)]
    gotcha: "reset khi major version (BR-05/08); per-user (nghĩa vụ compliance, OD-3)"
  feedback:
    columns: [id, version_id, user_id, category, status, body, created_at, updated_at]
    nullable: [body]
    indexes: [feedback_status_created_at_idx]
    gotcha: "category/status text; context server-attached (FBK-F-04)"
  audit_logs:
    columns: [id, actor_id, action, document_id, at, created_at]
    nullable: [actor_id, document_id]
    indexes: [audit_log_at_idx, audit_log_document_id_idx]
    pk: "(id, at) — composite (partition key phải nằm trong PK)"
    partitions: [audit_logs_2026_07, audit_logs_2026_08, audit_logs_default, "+ Quartz tự tạo tháng kế"]
    gotcha: "PARTITIONED theo tháng RANGE(at) từ 2026-07-25 (migration PartitionAuditLogs, ADR SDD §2.4) + DEFAULT partition + AuditPartitionMaintenanceJob (monthsAhead=2). actor_id GIỜ map từ sso_subject (upsert ON CONFLICT); action string sạch (bỏ 'by <sub>'); scheduler→actor_id NULL. Tạo partition cho tháng đã có rows trong DEFAULT sẽ FAIL (tạo trước). append-only (không updated_at). Giữ >=2 năm (NFR-03)."
  learning_paths:
    columns: [id, role_id, title, description, created_at, updated_at]
    nullable: [description]
    unique: [uq_learning_path_role (role_id)]   # 1 lộ trình / role (ONB-F-01)
    gotcha: "migration AddOnboarding (2026-07-25/26). role_id FK cascade. Seed dev: READER → 'Nhập môn Chất lượng' (DevDataSeeder.SeedOnboardingPathAsync, độc lập với seed doc)."
  path_items:
    columns: [id, learning_path_id, document_id, seq, mandatory, created_at]
    pk: [id]
    unique: [uq_path_item_doc (learning_path_id, document_id)]
    indexes: [path_items_path_seq_idx]
    gotcha: "seq int (thứ tự), mandatory bool. FK learning_path + document đều cascade. KHÔNG có updated_at (append-style). OnboardingService gộp item theo doc nếu user nhiều role."
  notifications:
    columns: [id, user_id, type, document_id, title, read_at, created_at, updated_at]
    nullable: [document_id, read_at]
    indexes: [notifications_user_read_created_idx]
    gotcha: "ADM-F-04/S19 (migration AddNotifications + AddNotificationDocFk). type text (doc_effective…). read_at null = chưa đọc. FK user cascade + FK document CASCADE (xoá doc → dọn notification, tránh doc_id treo → doc_id null bị serializer bỏ). Sinh ở EffectiveTransition.Apply path (VersionService.PublishAsync publish-tới-hạn + EffectiveTransitionService scheduler) cho AUDIENCE (role∈doc_audience_roles) ∪ SUBSCRIBERS (subscriptions), dedupe. NotificationService.CreateForAudienceAsync KHÔNG SaveChanges (commit chung như audit)."
  subscriptions:
    columns: [id, user_id, document_id, created_at]
    unique: [uq_subscription_user_doc (user_id, document_id)]
    gotcha: "ADM-F-04/S19 theo dõi tài liệu (migration AddSubscriptions). FK user + document đều CASCADE. SubscriptionService.ResolveAsync upsert user ON CONFLICT (theo dõi có thể là first-action). Người theo dõi được thêm vào tập nhận notification khi doc→Effective (union với audience). KHÔNG updated_at."
