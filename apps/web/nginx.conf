# Nginx: phục vụ SPA (React) + reverse-proxy /v1, /auth, /healthz → service 'api' (ADR-0011).
# Prod: bật block HTTPS (443) + chuyển hướng 80→443. Cert mount vào /etc/nginx/certs.

# --- HTTP (dev/prod-behind-LB). Prod có TLS: bỏ comment dòng redirect. ---
server {
    listen 80;
    server_name _;
    # return 301 https://$host$request_uri;   # <-- bật khi terminate TLS ở nginx này

    root /usr/share/nginx/html;
    index index.html;

    # A7 — security headers (áp cho SPA). HSTS chỉ bật ở block 443 (khi đã HTTPS).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # CSP: mở comment + THAY origin Keycloak thật vào connect-src (SPA fetch token endpoint) khi go-live.
    # Bake sai origin sẽ chặn login OIDC → để tắt mặc định, bật khi đã điền đúng.
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://sso.example.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # SPA fallback: mọi route không phải file → index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API REST + auth → backend .NET (service 'api' trong docker network).
    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /auth/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /healthz {
        proxy_pass http://api:8080;
    }

    # Cache asset tĩnh có hash (Vite) — an toàn cache dài.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

