# QGP CI/CD (ADR-0011): validate → build → test → package. GitLab CI + Docker trên Ubuntu.
# Commit/MR theo internal_rules/01_MR_Compliance (Conventional Commits, tag [AI]).

stages:
  - validate
  - test
  - package

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

# ── Validate: OpenAPI contract (single source cho FE/BE) ───────────────
openapi:lint:
  stage: validate
  image: node:20-alpine
  script:
    - npx --yes @redocly/cli@1 lint product-spec/api/openapi.yaml
  rules:
    - changes: [product-spec/api/openapi.yaml]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── Test: Backend (.NET) — integration test cần Postgres + Meili ──────
test:api:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
    - name: getmeili/meilisearch:v1.10
      alias: meilisearch
  variables:
    POSTGRES_USER: qgp
    POSTGRES_PASSWORD: qgp
    POSTGRES_DB: qgp_db
    MEILI_MASTER_KEY: qgp_ci_master_key
    MEILI_NO_ANALYTICS: "true"
    QGP_DB_CONNECTION: "Host=postgres;Port=5432;Database=qgp_db;Username=qgp;Password=qgp"
    QGP_MEILI_KEY: qgp_ci_master_key
    Meili__Url: "http://meilisearch:7700"
  script:
    - dotnet test apps/api/Qgp.Api.sln -c Release --logger "console;verbosity=normal"

# ── Test: Frontend (React/Vite) — typecheck + unit + build ────────────
test:web:
  stage: test
  image: node:20-alpine
  cache:
    key: "web-$CI_COMMIT_REF_SLUG"
    paths: [apps/web/node_modules]
  script:
    - cd apps/web
    - npm ci
    - npm run typecheck
    - npm run test
    - npm run build

# ── Package: build + push Docker image (chỉ trên default branch / tag) ─
.package:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

package:api:
  extends: .package
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/qgp-api:$CI_COMMIT_SHORT_SHA" apps/api
    - docker push "$CI_REGISTRY_IMAGE/qgp-api:$CI_COMMIT_SHORT_SHA"

package:web:
  extends: .package
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/qgp-web:$CI_COMMIT_SHORT_SHA"
      --build-arg VITE_OIDC_AUTHORITY="$OIDC_AUTHORITY"
      --build-arg VITE_USE_MOCK=0
      apps/web
    - docker push "$CI_REGISTRY_IMAGE/qgp-web:$CI_COMMIT_SHORT_SHA"
