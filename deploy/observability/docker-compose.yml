# QGP observability (ADR-0013) — stack RIÊNG, bật/tắt độc lập với app (DEPLOY.md §10).
#   api (ISC.Observability, OTLP gRPC) → otel-collector:4317 → Tempo (traces) · Prometheus (metrics) · Loki (logs) → Grafana
# Chạy SAU app stack (cần network của app để api resolve 'otel-collector'):
#   docker compose -f deploy/observability/docker-compose.yml --env-file deploy/.env.prod up -d
# App: OTEL_OTLP_ENDPOINT=http://otel-collector:4317 trong deploy/.env.prod.
name: qgp-obs

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - loki
    networks:
      default: {}
      app:
        aliases: [otel-collector]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/qgp.yaml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki
    # Chỉ bind loopback — truy cập qua SSH tunnel / reverse proxy có auth, KHÔNG mở public.
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped

networks:
  # Network mặc định của app stack (project 'qgp-prod' → 'qgp-prod_default').
  app:
    external: true
    name: ${QGP_APP_NETWORK:-qgp-prod_default}

volumes:
  prometheus_data:
  tempo_data:
  loki_data:
  grafana_data:
