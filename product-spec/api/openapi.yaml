                slug:
                  type: string
                name:
                  type: string
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '409':
          $ref: '#/components/responses/DefaultError'
  /admin/tags/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      tags:
      - Admin
      summary: Sửa tag (slug/tên)
      operationId: updateTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slug:
                  type: string
                name:
                  type: string
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '409':
          $ref: '#/components/responses/DefaultError'
    delete:
      tags:
      - Admin
      summary: Xoá tag (409 nếu đang gắn tài liệu)
      operationId: deleteTag
      responses:
        '204':
          description: Đã xoá
        '409':
          $ref: '#/components/responses/DefaultError'
  /doc-types:
    get:
      tags:
      - Admin
      summary: Loại tài liệu đang dùng (active) cho form tạo/lọc (ADM-F-02)
      operationId: listActiveDocTypes
      responses:
        '200':
          description: Trang loại tài liệu active
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403':
          $ref: '#/components/responses/DefaultError'
  /admin/doc-types:
    get:
      tags:
      - Admin
      summary: Quản trị loại tài liệu (kể cả ẩn)
      operationId: listDocTypes
      responses:
        '200':
          description: Trang loại tài liệu
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403':
          $ref: '#/components/responses/DefaultError'
    post:
      tags:
      - Admin
      summary: Thêm loại tài liệu mới (code ổn định)
      operationId: createDocType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                label:
                  type: string
                seq:
                  type: integer
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '409':
          $ref: '#/components/responses/DefaultError'
  /admin/doc-types/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      tags:
      - Admin
      summary: Sửa loại tài liệu (label/seq/active — code bất biến)
      operationId: updateDocType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                seq:
                  type: integer
                active:
                  type: boolean
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: '#/components/responses/DefaultError'
    delete:
      tags:
      - Admin
      summary: Xoá loại tài liệu (409 nếu đang dùng)
      operationId: deleteDocType
      responses:
        '204':
          description: Đã xoá
        '409':
          $ref: '#/components/responses/DefaultError'
  /documents/{docId}/audience:
    parameters:
    - name: docId
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Admin
      summary: Audience roles của tài liệu (ADM-F-02)
      operationId: getDocAudience
      responses:
        '200':
          description: Danh sách audience role + lý do
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: '#/components/responses/DefaultError'
    put:
      tags:
      - Admin
      summary: Đặt lại toàn bộ audience roles của tài liệu
      operationId: setDocAudience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - audience
              properties:
                audience:
                  type: array
                  items:
                    type: object
                    required:
                    - role
                    properties:
                      role:
                        type: string
                      reason:
                        type: string
      responses:
        '200':
          description: Audience sau cập nhật
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          $ref: '#/components/responses/DefaultError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token từ SSO nội bộ (ADM-F-05, NFR-04)
  parameters:
    DocId:
      name: doc_id
      in: path
      required: true
      schema:
        type: string
      description: vd QA-PROC-005
    VersionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Bắt buộc cho verb unsafe (§3.4). Same key+body → cache; khác body → 409.
    Query:
      name: q
      in: query
      schema:
        type: string
      description: từ khoá tìm kiếm
    FilterType:
      name: type
      in: query
      schema:
        $ref: '#/components/schemas/DocumentType'
    FilterTag:
      name: tag
      in: query
      schema:
        type: string
    FilterStatus:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/VersionStatus'
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: opaque cursor (§3.5)
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 200
  responses:
    Unauthorized:
      description: Thiếu/không hợp lệ token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Sai role (RBAC §10.1)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Lỗi validate (BR-01/04/07...)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StateConflict:
      description: Chuyển trạng thái không hợp lệ (state machine §4.3)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    VersionOk:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentVersion'
    DefaultError:
      description: Lỗi (client/nghiệp vụ) — xem code trong Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    DocumentType:
      type: string
      enum:
      - Policy
      - Process
      - Procedure
      - Work Instruction
      - Template
      - Checklist
      - Standard
    VersionStatus:
      type: string
      enum:
      - Draft
      - InReview
      - Approved
      - Published
      - Effective
      - Superseded
      - Retired
    FeedbackCategory:
      type: string
      enum:
      - content_error
      - unclear
      - improvement
      - question
    FeedbackStatus:
      type: string
      enum:
      - New
      - Triaged
      - InProgress
      - Resolved
      - Rejected
    DocumentSummary:
      type: object
      required:
      - doc_id
      - title
      - type
      - effective_version
      - status
      properties:
        doc_id:
          type: string
        title:
          type: string
        type:
          $ref: '#/components/schemas/DocumentType'
        classification:
          type: string
        effective_version:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/VersionStatus'
        tags:
          type: array
          items:
            type: string
    Document:
      allOf:
      - $ref: '#/components/schemas/DocumentSummary'
      - type: object
        properties:
          mandatory_ack:
            type: boolean
          next_review_date:
            type:
            - string
            - 'null'
            format: date
          audience_roles:
            type: array
            items:
              type: string
            description: REC-F-01
    DocumentDetail:
      allOf:
      - $ref: '#/components/schemas/Document'
      - type: object
        properties:
          is_effective:
            type: boolean
            description: false → cảnh báo non-Effective (DOC-F-12)
          badge:
            type:
            - string
            - 'null'
            description: vd Sap ap dung tu 15/07/2026
          effective_link:
            type:
            - string
            - 'null'
            description: link tới bản Effective nếu đang xem bản khác
          content_html:
            type: string
            description: Markdown render (Markdig)
    DocumentVersion:
      type: object
      required:
      - id
      - doc_id
      - version
      - status
      properties:
        id:
          type: string
          format: uuid
        doc_id:
          type: string
        version:
          type: string
          pattern: ^\d+\.\d+$
        status:
          $ref: '#/components/schemas/VersionStatus'
        issue_date:
          type:
          - string
          - 'null'
          format: date
        effective_date:
          type:
          - string
          - 'null'
          format: date
        change_summary:
          type: string
        created_at:
          type: string
          format: date-time
    ReviewQueueItem:
      type: object
      description: Một version đang chờ duyệt (S9 review queue).
      required:
      - version_id
      - doc_id
      - title
      - version
      - submitted_at
      properties:
        version_id:
          type: string
          format: uuid
        doc_id:
          type: string
        title:
          type: string
        version:
          type: string
          pattern: ^\d+\.\d+$
        submitted_at:
          type: string
          format: date-time
          description: Thời điểm chuyển sang InReview (version.updated_at).
    VersionContent:
      type: object
      description: Nội dung markdown của một version (dùng cho editor S7).
      required:
      - version_id
      - doc_id
      - version
      - status
      - content_markdown
      properties:
        version_id:
          type: string
          format: uuid
        doc_id:
          type: string
        version:
          type: string
        status:
          $ref: '#/components/schemas/VersionStatus'
        content_markdown:
          type: string
    UpdateContentRequest:
      type: object
      required:
      - content_markdown
      properties:
        content_markdown:
          type: string
          description: Nội dung markdown mới của bản draft.
    CreateDocumentRequest:
      type: object
      required:
      - doc_id
      - title
      - type
      properties:
        doc_id:
          type: string
          pattern: ^[A-Z]{2,}-[A-Z]{2,}-\d{3,}$
        title:
          type: string
          minLength: 1
          maxLength: 200
        type:
          $ref: '#/components/schemas/DocumentType'
        classification:
          type: string
        mandatory_ack:
          type: boolean
          default: false
        next_review_date:
          type: string
          format: date
        audience_roles:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        content_markdown:
          type: string
    CreateVersionRequest:
      type: object
      required:
      - change_type
      properties:
        change_type:
          type: string
          enum:
          - minor
          - major
          description: BR-05
        content_markdown:
          type: string
    PublishRequest:
      type: object
      required:
      - issue_date
      - effective_date
      - change_summary
      properties:
        issue_date:
          type: string
          format: date
        effective_date:
          type: string
          format: date
          description: có thể tương lai; >= issue_date (BR-07)
        change_summary:
          type: string
          minLength: 1
          maxLength: 500
          description: bắt buộc (BR-04)
    PublishResult:
      type: object
      properties:
        version_id:
          type: string
          format: uuid
        doc_id:
          type: string
        version:
          type: string
        status:
          $ref: '#/components/schemas/VersionStatus'
        effective_date:
          type: string
          format: date
        badge:
          type:
          - string
          - 'null'
    Acknowledgement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        acked_at:
          type: string
          format: date-time
    Feedback:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        doc_id:
          type: string
          description: Mã tài liệu (server gắn — tiện cho triage S14).
        version:
          type: string
        category:
          $ref: '#/components/schemas/FeedbackCategory'
        status:
          $ref: '#/components/schemas/FeedbackStatus'
        body:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
    CreateFeedbackRequest:
      type: object
      required:
      - doc_id
      - version
      - category
      description: Ngữ cảnh (doc_id/version/url) đính kèm; server tự gắn, không tin client cho định danh (FBK-F-04).
      properties:
        doc_id:
          type: string
        version:
          type: string
        url:
          type: string
        category:
          $ref: '#/components/schemas/FeedbackCategory'
        body:
          type: string
          maxLength: 2000
    RecommendationItem:
      type: object
      required:
      - doc_id
      - version
      - reason
      properties:
        doc_id:
          type: string
        version:
          type: string
        title:
          type: string
        effective_date:
          type:
          - string
          - 'null'
          format: date
        reason:
          type: string
          description: 'explainable: bat buoc / can doc lai / khop role / vua cap nhat (BR-11)'
    Recommendations:
      type: object
      properties:
        must_read:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationItem'
        suggested:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationItem'
    OnboardingItem:
      type: object
      required:
      - doc_id
      - title
      - seq
      - mandatory
      - acked
      properties:
        doc_id:
          type: string
        title:
          type: string
        seq:
          type: integer
        mandatory:
          type: boolean
        effective_version:
          type:
          - string
          - 'null'
        acked:
          type: boolean
          description: user đã xác nhận đọc bản Effective (DOC-F-09)
    OnboardingProgress:
      type: object
      required:
      - total
      - read
      - percent
      properties:
        total:
          type: integer
        read:
          type: integer
        percent:
          type: integer
          description: '0..100 (read/total)'
    Onboarding:
      type: object
      required:
      - progress
      - items
      properties:
        title:
          type: string
        roles:
          type: array
          items:
            type: string
        progress:
          $ref: '#/components/schemas/OnboardingProgress'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingItem'
    Notification:
      type: object
      required:
      - id
      - type
      - title
      - read
      - created_at
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: 'doc_effective (mở rộng: review_due…)'
        doc_id:
          type:
          - string
          - 'null'
        title:
          type: string
        read:
          type: boolean
        created_at:
          type: string
          format: date-time
    NotificationList:
      type: object
      required:
      - data
      - unread_count
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        unread_count:
          type: integer
    Subscription:
      type: object
      required:
      - doc_id
      - title
      - subscribed_at
      properties:
        doc_id:
          type: string
        title:
          type: string
        subscribed_at:
          type: string
          format: date-time
    SubscriptionStatus:
      type: object
      required:
      - doc_id
      - subscribed
      properties:
        doc_id:
          type: string
        subscribed:
          type: boolean
    SearchHit:
      type: object
      properties:
        doc_id:
          type: string
        version:
          type: string
        title:
          type: string
        snippet:
          type: string
        score:
          type: number
    AuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor:
          type: string
        action:
          type: string
        document_id:
          type:
          - string
          - 'null'
          format: uuid
        at:
          type: string
          format: date-time
    AssistantAnswer:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - answered
          - insufficient
          description: insufficient = "không chắc" (BOT-F-04)
        answer:
          type:
          - string
          - 'null'
        citations:
          type: array
          description: bắt buộc khi answered (BOT-F-03)
          items:
            type: object
            properties:
              doc_id:
                type: string
              version:
                type: string
              effective_date:
                type: string
                format: date
              url:
                type: string
              snippet:
                type: string
    Page:
      type: object
      properties:
        next_cursor:
          type:
          - string
          - 'null'
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: mã lỗi theo ISC Error Code catalog
            message:
              type: string
            details:
              type:
              - object
              - 'null'
              additionalProperties: true
